name: PROOF
description: >-
  PROOF is a digital art and NFT platform built on the belief that "art is proof
  of our collective humanity." It is the company behind Moonbirds (its flagship
  profile-picture collection), the 1,000-member PROOF Collective, and collections
  including Oddities, Mythics, and the Grails art-collector experience, alongside
  the Lunar Society community-governance program, a research arm, live events, and
  a podcast. PROOF is backed by a16z and Kindred Ventures. Its public surface is a
  consumer/collector documentation site (docs.proof.xyz) and marketing site; PROOF
  does not currently publish a programmatic developer API, OpenAPI spec, SDKs, or
  webhooks.
